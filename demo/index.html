<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="da" style="font-size: 100%">
<head>
	<title>fcoo.dk - fcoo-collection-model-domain - Demo</title>
	<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv='x-dns-prefetch-control' content='on'>

	<meta name='copyright' content='FCOO'>
	<meta name='owner' content='FCOO'>

  <link  href="bower_components.css" rel="stylesheet">
  <link  href="../src/fcoo-collection-model-domain.css" rel="stylesheet">
</head>

<body style="padding:30px">
    <script>
        window.fcoo = window.fcoo || {};
        window.fcoo.DEMO_VERSION = true;
        //OR window.fcoo.LOCAL_DATA = true;

        window.FCOOCOLLECTION_TEST_NOW = false;
        window.FCOOCOLLECTION_TEST_STATUS = true;
    </script>

	<script src="bower_components.js"></script>


	<script src="../src/10-model-domain.js"></script>
	<script src="../src/20-collections.js"></script>
	<script src="../src/30-datasets.js"></script>

    <script src="../src/50-load.js"></script>
	<script src="../src/60-parameter-unit-extend.js"></script>
	<script>

//HER           window.fcoo.LOCAL_DATA = true;


    //window.fcoo.FCMD_FORCE_LAND = true;

    window.fcoo.FCMD_FORCE_LAND  = window.fcoo.FCMD_FORCE_LAND  || (window.location.search =='?land');
    window.fcoo.FCMD_FORCE_OCEAN = window.fcoo.FCMD_FORCE_OCEAN || (window.location.search =='?ocean');

    //TEMP: No access to data-files on AWS. Read from old location instead
    window.fcoo.path.setPath({host: 'bal.fcoo.dk'});
    window.bsIsTouch = window.bsIsTouch || (window.location.search =='?touch');

    i18next.init();
    i18next.changeLanguage('en');
    i18next.options.fallbackLng = i18next.language == 'da' ? 'en' : 'da';

    moment.sfSetFormat({ time: 24, timezone:'UTC' } );

    Promise.defaultErrorHandler = function(error){ console.log(error)};


    fcoo.collection.options.includeCollections = true;
    fcoo.collection.options.relativeTimeRange = [-24, 48];


    let testNow = moment().startOf('hour');
    let minNow = moment(testNow);
    window.__jbs_getNowMoment = function(){ return moment(testNow); };

    function changeNow( delta = -6){
        testNew = testNow.add(delta, 'hour');
        console.log('NOW = ',testNow.format());
        fcoo.collection._onNowChanged();
    };

    fcoo.promiseList.options.finish.push(() => {
        fcoo.collection._onNowChanged();
        let $body = $('body');

        let  bounds = L.latLngBounds([[61.52269494598361, 14.833984375000001], [53.08082737207479, -1.667480468750002]]);

        let asModalOptions = {
                backgroundId: 'charts', //'strandard', 'charts', 'gray', 'retro'
                bounds   :  bounds,
                timeRange: [-2*24, 5*24],
                timeColor: {
                    past  : 'pink',
                    now   : 'green',
                    future: 'lightblue'
                },
                time : 9,

            }
        fcoo.collection.collectionList.list.forEach( collection => {

            $body.append('<hr>');
            $.bsButton({
                text    : collection.options.title,
                onClick : () => collection.asModal(asModalOptions)
            }).appendTo($body);
            $.each(collection.parameters, (id,parameter) => {
                $body.append('<br>');
                $.bsButton({
                    text   : parameter.name,
                    onClick: () => parameter.collectionAsModal(asModalOptions)
                }).appendTo($body);
            });
        });

    });

    fcoo.promiseList_getAll();
</script>

    <button onClick="javascript:changeNow(-1)">Now - 1h</button><button onClick="javascript:changeNow(+1)">Now + 1h</button><br>
    <button onClick="javascript:changeNow(-3)">Now - 3h</button><button onClick="javascript:changeNow(+3)">Now + 3h</button><br>
    <button onClick="javascript:changeNow(-6)">Now - 6h</button><button onClick="javascript:changeNow(+6)">Now + 6h</button><br>
    <hr>
</body>
</html>
